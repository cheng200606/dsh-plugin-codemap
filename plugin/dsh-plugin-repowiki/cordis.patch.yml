- insert:
    - id: repowiki
      name: 'dsh-plugin-repowiki'
      config:
        outputDir: '.dsh/repowiki'
        maxFiles: 8000
        maxPages: 24
        maxFileBytes: 524288
        concurrency: 3
        defaultLanguage: 'zh'
        defaultTemplate: 'architecture'
        autoUpdate: false
